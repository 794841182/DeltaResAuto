# 自动检测分辨率 · 配置示例
# 实际配置在 %LOCALAPPDATA%\DeltaResAuto\settings.ini，本文件只作说明，程序不会读取它。
# 等号左边是键名，右边是值；# 开头的行会被忽略。

# 游戏运行时切换到的分辨率
# 画面比例在界面里选（游戏运行时 / 退出游戏后分别选），程序会自动匹配当前显示器支持的模式
GameW=1440
GameH=1080

# 退出游戏后恢复的桌面分辨率（切换前程序也会记录真实模式，优先用它恢复）
DeskW=1920
DeskH=1440

# 游戏刷新率：0 = 跟随系统，其余为具体 Hz（必须在该分辨率下被显卡支持）
GameHz=0

# 检测到游戏后再等多久切换（毫秒）
DelayMs=3000

# 轮询间隔（毫秒，最小 500）
PollMs=2000

# 要监测的进程名，逗号分隔
GameExes=deltaforceclient-win64-shipping.exe,deltaforceclient.exe

# 进程名里包含这些关键词也算匹配（用于不同渠道/版本）
MatchKeys=deltaforce,三角洲

# 显示名里包含这些关键词就跳过（防止误判启动器、反作弊、更新器）
ExcludeKeys=launcher,uninst,bugreport,crashpad,icreate,recorder,ffmpeg,tiny,updater,setup,install,config,webview,browser,tenprotect,taslogin,es_brd,qbblink,assistant,gpu_detect,startup_runner,crashreport,downloader

# 手动添加的游戏：exe|显示名;exe|显示名
CustomGames=

# 界面缩放：0 = 跟随系统 DPI；也可填 0.5 / 0.75 / 1 / 1.25 / 1.5 / 2
UIScale=0

# 背景主题：0 = 珠链（保留纹理，轻微柔化）；1 = 深空（无纹理，最清晰）；2 = 米白（亮色暖纸）
Theme=0

# 要切换的显示器：空 = 主屏；否则形如 \\.\DISPLAY2
DisplayDevice=
